# Opens the live site in a real browser and checks that GoatCounter accepts the page view
# and the conversion events. Visits are tagged with ?utm_source=onespace-check so they are
# easy to recognise in the dashboard. Run it from Actions › analytics-check.
name: analytics-check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [assets/os.js, tests/analytics_check.py, .github/workflows/analytics-check.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet playwright && python3 -m playwright install --with-deps chromium >/dev/null
      - name: Visit onespace.live and record what GoatCounter receives
        run: python3 tests/analytics_check.py
