name: Regenerate localized site on translation branch
on:
  push:
    branches: [i18n-arabic-plus-es-fr-de-foundation]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: localized-site-${{ github.ref }}
  cancel-in-progress: false
jobs:
  generate:
    if: github.ref == 'refs/heads/i18n-arabic-plus-es-fr-de-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: i18n-arabic-plus-es-fr-de-foundation
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet beautifulsoup4==4.15.0
      - name: Regenerate all locale pages, maps and sitemap from source
        run: python3 build.py
      - name: Validate generated site and JS
        run: |
          python3 tests/check_site.py
          node --check assets/os.js
          node --check assets/ar.js
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          for lang in ('es','fr','de'):
              p=Path(lang)/'index.html'
              assert p.exists(), f'{p} missing'
              txt=p.read_text()
              assert 'lang="'+lang+'"' in txt
              assert '<form data-form="join"' in txt
          PY
      - name: Commit generated site back to branch, only when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html' 'ar/*.html' 'es/*.html' 'fr/*.html' 'de/*.html' assets/ar.js sitemap.xml robots.txt llms.txt site.webmanifest
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate five-language static site'
            git push origin HEAD:i18n-arabic-plus-es-fr-de-foundation
          fi
