name: Rebuild and validate localized UI polish
on:
  push:
    branches: [polish-localized-nav-scroll-stores-copy]
    paths: [.github/workflows/locale-ui-qa.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: onespace-locale-ui-qa
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish-localized-nav-scroll-stores-copy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet beautifulsoup4==4.15.0
      - name: Rebuild all five languages from original OneSpace templates
        run: python3 build.py
      - name: Verify localized page parity, links, semantics, and JS
        run: |
          python3 tests/check_site.py
          node --check assets/os.js
          node --check assets/ar.js
      - name: Commit source-derived website pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html' 'ar/*.html' 'es/*.html' 'fr/*.html' 'de/*.html' assets/ar.js sitemap.xml robots.txt llms.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate localized layouts and reviewed website copy'
            git push origin HEAD:polish-localized-nav-scroll-stores-copy
          fi
