name: Website quality check
on:
  push:
    branches: [main]
    paths: ["*.html", "assets/**", "build.py", "content/**", "tests/**", ".github/workflows/site-check.yml", "sitemap.xml", "robots.txt"]
  pull_request:
    branches: [main]
jobs:
  static-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify HTML, internal links and accessibility basics
        run: python3 tests/check_site.py
      - name: Verify browser JavaScript syntax
        run: |
          node --check assets/os.js
          node --check assets/ar.js
      - name: Pages are generated from build.py (no hand edits)
        run: |
          python3 build.py
          git diff --exit-code -- '*.html' assets/ar.js || (echo "Run python3 build.py and commit the result" && exit 1)
