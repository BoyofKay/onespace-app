<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3A27E"/>
      <stop offset="1" stop-color="#E2654C"/>
    </linearGradient>
    <linearGradient id="cross" x1="380" y1="0" x2="640" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8735A"/>
      <stop offset="0.5" stop-color="#9C6E6A"/>
      <stop offset="1" stop-color="#1F6670"/>
    </linearGradient>
  </defs>
  <!-- ring, open at the bottom for the heart point -->
  <path d="M 345 825 A 370 370 0 1 1 655 825" fill="none" stroke="url(#ring)" stroke-width="50" stroke-linecap="round"/>
  <!-- inner arc: from the "1" over to the partner's side -->
  <path d="M 560 250 A 200 200 0 0 1 810 470" fill="none" stroke="#E8765B" stroke-width="42" stroke-linecap="round"/>
  <!-- heads -->
  <circle cx="352" cy="390" r="60" fill="#EF7E5E"/>
  <circle cx="648" cy="390" r="60" fill="#1E6C73"/>
  <!-- "1" -->
  <path d="M 476 405 L 506 380 L 506 478" fill="none" stroke="#EA8A5F" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- left loop (coral): from the point, up around the left lobe, into the crossing -->
  <path d="M 500 870 C 400 790, 255 690, 262 600 C 270 505, 380 480, 440 545 L 560 680"
        fill="none" stroke="#E8735A" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- right loop (teal): from the crossing, around the right lobe, down to the point -->
  <path d="M 560 680 C 610 735, 700 715, 730 640 C 765 550, 690 480, 620 505 C 575 520, 545 560, 520 600"
        fill="none" stroke="#1F6670" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 738 610 C 740 700, 600 800, 500 870"
        fill="none" stroke="#1F6670" stroke-width="52" stroke-linecap="round"/>
  <!-- the crossing stroke on top (coral to teal) -->
  <path d="M 440 545 L 560 680" fill="none" stroke="url(#cross)" stroke-width="52" stroke-linecap="round"/>
</svg>
