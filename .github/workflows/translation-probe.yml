name: Translation endpoint feasibility
on:
  push:
    branches: [full-localization-es-fr-de-preserve-design]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Google public translation interface
        run: |
          python3 - <<'PY'
          import json,urllib.parse,urllib.request
          qs=urllib.parse.urlencode([('client','gtx'),('sl','en'),('tl','es'),('dt','t'),('q','Hello, my love!'),('q','Plan your next trip together.')])
          u='https://translate.googleapis.com/translate_a/single?'+qs
          try:
            r=urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=20)
            print('PROBE:',r.status,r.read(500).decode('utf8'))
          except Exception as e:print('PROBE_FAILED:',type(e).__name__,str(e)[:500]);raise
          PY
