name: Translation endpoint feasibility
on:
  push:
    branches: [full-localization-es-fr-de-preserve-design]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe alternate translation interfaces
        run: |
          python3 - <<'PY'
          import urllib.parse,urllib.request
          endpoints=[
          'https://translate.googleapis.com/translate_a/t?'+urllib.parse.urlencode([('client','dict-chrome-ex'),('sl','en'),('tl','es'),('q','Hello, my love!'),('q','Plan your next trip together.')]),
          'https://api.mymemory.translated.net/get?'+urllib.parse.urlencode({'q':'Plan your next trip together','langpair':'en|es'}),
          ]
          for u in endpoints:
            try:
              r=urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=12)
              print('PROBE_OK',u.split('/')[2],r.status,r.read(550).decode('utf8'))
            except Exception as e: print('PROBE_FAIL',u.split('/')[2],type(e).__name__,str(e)[:160])
          PY
