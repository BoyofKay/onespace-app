# End-to-end check of the Founder waitlist on the live site.
# Step 1: run with an email → submits the real form and checks the "check your inbox" screen.
# Step 2 (optional): run again with a confirmation token → opens the confirmation page and reads the Founder number.
name: founders-e2e
on:
  workflow_dispatch:
    inputs:
      email: { description: 'Test email (e.g. delivered+site@resend.dev)', required: false, default: '' }
      token: { description: 'Confirmation token (48 hex) to test the confirmation page', required: false, default: '' }
      lang: { description: 'en or ar', required: false, default: 'en' }
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet playwright && python3 -m playwright install --with-deps chromium >/dev/null
      - run: python3 tests/founders_e2e.py "${{ inputs.email }}" "${{ inputs.token }}" "${{ inputs.lang }}"
