name: Reviewed multilingual longform and legal QA
# Final run: include complete guide paragraphs and localized account-deletion process.
on:
  push:
    branches: [locale-editorial-legal-faq-guides-review]
    paths:
      - .github/workflows/longform-locale-qa.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: onespace-longform-locale-qa
  cancel-in-progress: false
jobs:
  generate-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: locale-editorial-legal-faq-guides-review
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet beautifulsoup4==4.15.0
      - name: Generate full website in five languages
        run: python3 build.py
      - name: Validate page parity and reviewed editorial coverage
        run: |
          python3 tests/check_site.py
          python3 tests/check_locale_editorial.py
          node --check assets/os.js
          node --check assets/ar.js
      - name: Commit generated locale editions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html' 'ar/*.html' 'es/*.html' 'fr/*.html' 'de/*.html' assets/ar.js sitemap.xml robots.txt llms.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate reviewed legal, FAQ and relationship guide translations'
            git push origin HEAD:locale-editorial-legal-faq-guides-review
          fi
