name: Regenerate complete five-language website
on:
  push:
    branches: [full-localization-es-fr-de-preserve-design]
    paths:
      - .github/workflows/full-regenerate.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: onespace-full-website-regenerate
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: full-localization-es-fr-de-preserve-design
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet beautifulsoup4==4.15.0
      - name: Render all language variants from original pages
        run: python3 build.py
      - name: Validate structural and translation parity
        run: |
          python3 tests/check_site.py
          node --check assets/os.js
          node --check assets/ar.js
      - name: Commit complete generated pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html' 'ar/*.html' 'es/*.html' 'fr/*.html' 'de/*.html' assets/ar.js sitemap.xml robots.txt llms.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate complete English Arabic Spanish French German website'
            git push origin HEAD:full-localization-es-fr-de-preserve-design
          fi
