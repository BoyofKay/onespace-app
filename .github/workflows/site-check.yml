name: Website quality check
on:
  push:
    branches: [main]
    paths: ["*.html", "assets/**", "build.py", "content/**", "tests/**", ".github/workflows/site-check.yml", "sitemap.xml", "robots.txt"]
  pull_request:
    branches: [main]
concurrency:
  group: website-quality-${{ github.ref }}
  cancel-in-progress: false
jobs:
  static-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build tools
        run: pip install --quiet beautifulsoup4==4.15.0
      - name: Rebuild canonical and translated pages
        run: python3 build.py
      - name: Verify HTML, internal links and accessibility basics
        run: python3 tests/check_site.py
      - name: Verify full mega navigation across five languages
        run: python3 tests/check_megamenu.py
      - name: Verify browser JavaScript syntax
        run: |
          node --check assets/os.js
          node --check assets/ar.js
      - name: Commit generated pages and legal revisions on main
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          if ! git diff --quiet -- '*.html' assets/ar.js assets/legal-revisions.json sitemap.xml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*.html' assets/ar.js assets/legal-revisions.json sitemap.xml
            git commit -m "chore(site): refresh localized generated pages"
            git push origin HEAD:main
          fi
      - name: Verify generated files are synchronized
        run: |
          git diff --exit-code -- '*.html' assets/ar.js assets/legal-revisions.json sitemap.xml
