name: Editorial mega menu generation & responsive QA
on:
  push:
    branches: [editorial-mega-menu-navigation]
    paths: [.github/workflows/mega-menu-qa.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editorial-mega-menu-navigation
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python3 -m pip install --quiet beautifulsoup4==4.15.0
          npm install --no-audit --no-fund --no-save --no-package-lock playwright@1.56.1
      - name: Rebuild five-language website and verify all links
        run: |
          python3 build.py
          python3 tests/check_site.py
          python3 tests/check_megamenu.py
          python3 tests/check_locale_editorial.py
          node --check assets/os.js
      - name: Real browser menu and responsive layout tests
        run: |
          google-chrome --version
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/onespace-web.log 2>&1 &
          node scripts/check_locale_layout.mjs
      - name: Commit generated pages with preserved original visuals and translations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html' 'ar/*.html' 'es/*.html' 'fr/*.html' 'de/*.html' assets/ar.js sitemap.xml robots.txt llms.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Build editorial mega menu on every OneSpace language page'
            git push origin HEAD:editorial-mega-menu-navigation
          fi
